name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --group dev --all-extras
      - run: uv run pytest

  integration-mongodb:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval \"db.runCommand({ping:1})\""
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
      - run: uv sync --group dev --extra mongodb
      - run: uv run pytest tests/external/test_mongodb.py -v
        env:
          MONGODB_URI: mongodb://localhost:27017
          MONGODB_DATABASE: grannos_test

  integration-neo4j:
    runs-on: ubuntu-latest
    services:
      neo4j:
        image: neo4j:5
        ports:
          - 7687:7687
          - 7474:7474
        env:
          NEO4J_AUTH: neo4j/test-Password
        options: >-
          --health-cmd "cypher-shell -u neo4j -p test-Password 'RETURN 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
      - run: uv sync --group dev --extra neo4j
      - run: uv run pytest tests/external/test_neo4j.py -v
        env:
          NEO4J_URI: bolt://localhost:7687
          NEO4J_USER: neo4j
          NEO4J_PASSWORD: test-Password

  integration-sqlserver:
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        ports:
          - 1433:1433
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: test-Password
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost,1433 -U sa -P test-Password -No -Q 'SELECT 1'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
      - run: uv sync --group dev --extra mssql
      - run: uv run pytest tests/external/test_sqlserver.py -v
        env:
          MSSQL_HOST: localhost
          MSSQL_PORT: "1433"
          MSSQL_USER: sa
          MSSQL_PASSWORD: test-Password

  integration-elasticsearch:
    runs-on: ubuntu-latest
    services:
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
        ports:
          - 9200:9200
        env:
          discovery.type: single-node
          xpack.security.enabled: "false"
          ES_JAVA_OPTS: "-Xms512m -Xmx512m"
        options: >-
          --health-cmd "curl -sf http://localhost:9200/_cluster/health"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
      - run: uv sync --group dev --extra elasticsearch
      - run: uv run pytest tests/external/test_elasticsearch.py -v
        env:
          ELASTICSEARCH_HOST: localhost
          ELASTICSEARCH_PORT: "9200"
          ELASTICSEARCH_PROTOCOL: http
